name: My YourTomo cat

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate animated cat
        uses: prsdx/github-pet@v1
        with:
          username: alexheitorc
          timezone-offset-minutes: "-180"
